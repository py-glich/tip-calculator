<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tip Calculator</title>
  <link rel="stylesheet" href="style.css"/>
</head>

<body>

  <div class="container">

    <h1>Tip Calculator</h1>

    <!-- Bill -->
    <div class="field">
      <label>Bill Amount (Rs)</label>
      <input type="number" id="bill" placeholder="Enter bill amount"/>
      <small id="billError" class="error"></small>
    </div>

    <!-- Tip -->
    <div class="field">
      <label>Tip %</label>

      <div class="tips">
        <button class="tip active" data-tip="10">10%</button>
        <button class="tip" data-tip="15">15%</button>
        <button class="tip" data-tip="20">20%</button>
      </div>

      <input type="number" id="customTip" placeholder="Custom tip %"/>
      <small id="tipError" class="error"></small>
    </div>

    <!-- People -->
    <div class="field">
      <label>People</label>
      <input type="number" id="people" value="1" min="1"/>
      <small id="peopleError" class="error"></small>
    </div>

    <!-- Results -->
    <div class="results">
      <div>Total Tip: <span id="tipAmount">Rs 0.00</span></div>
      <div>Grand Total: <span id="totalAmount">Rs 0.00</span></div>
      <div>Per Person: <span id="perPerson">Rs 0.00</span></div>
    </div>

    <button id="reset">Reset</button>

  </div>

  <script src="script.js"></script>
</body>
</html>
