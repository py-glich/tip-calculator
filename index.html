<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Tip Calculator</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="container">

    <h1>Tip Calculator</h1>

    <!-- Bill Amount -->
    <div class="field">

      <label for="bill">Bill Amount (Rs)</label>

      <input
        type="number"
        id="bill"
        placeholder="Enter bill amount"
      />

      <p class="error" id="bill-error"></p>

    </div>

    <!-- Tip Selection -->
    <div class="field">

      <label>Select Tip %</label>

      <div class="tip-buttons">

        <button class="tip-btn active">10%</button>

        <button class="tip-btn">15%</button>

        <button class="tip-btn">20%</button>

        <input
          type="number"
          id="custom-tip"
          placeholder="Custom %"
        />

      </div>

      <p class="error" id="tip-error"></p>

    </div>

    <!-- Results -->
    <div class="results">

      <div class="result-row">
        <span>Total Tip</span>
        <strong id="tip-amount">Rs 0.00</strong>
      </div>

      <div class="result-row">
        <span>Grand Total</span>
        <strong id="grand-total">Rs 0.00</strong>
      </div>

      <div class="result-row">
        <span>Per Person</span>
        <strong id="per-person">Rs 0.00</strong>
      </div>

      <!-- Reset Button -->
      <button id="reset-btn">
        Reset
      </button>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
